name: Publish Mineiro docs v1.3.2

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-docs-v1.3.2.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout documentation branch
        uses: actions/checkout@v4
        with:
          ref: release/mineiro-v1.3.2-docs
          fetch-depth: 0

      - name: Materialize documentation package
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .bootstrap/docs.zip.b64 > /tmp/mineiro-docs.zip
          unzip -o /tmp/mineiro-docs.zip -d .
          rm -rf .bootstrap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: materialize v1.3.2 documentation package"
          git push origin HEAD:release/mineiro-v1.3.2-docs

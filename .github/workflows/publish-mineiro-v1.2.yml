name: Publish Mineiro v1.2.0

on:
  push:
    branches: [main]
    paths: [".github/workflows/publish-mineiro-v1.2.yml"]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staged release
        uses: actions/checkout@v4
        with:
          ref: release/mineiro-v1.2.0
          fetch-depth: 0

      - name: Reconstruct final release
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .bootstrap/final-payload.b64 > /tmp/mineiro-final.tar.gz
          mkdir -p /tmp/mineiro-release
          tar -xzf /tmp/mineiro-final.tar.gz -C /tmp/mineiro-release
          rm -rf /tmp/mineiro-release/.github

      - name: Replace release branch tree
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/keep
          if [ -d .github ]; then mv .github /tmp/keep/.github; fi
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/mineiro-release/. .
          if [ -d /tmp/keep/.github ]; then mv /tmp/keep/.github .github; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "release: Mineiro Username Extractor v1.2.0"
          git push origin HEAD:release/mineiro-v1.2.0

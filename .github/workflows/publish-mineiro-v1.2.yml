name: Publish Mineiro v1.2.0 release branch

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-mineiro-v1.2.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staged release
        uses: actions/checkout@v4
        with:
          ref: release/mineiro-v1.2.0
          fetch-depth: 0

      - name: Reconstruct release payload
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/payload.part00 .bootstrap/payload.rest > /tmp/mineiro.tar.xz.b64
          base64 --decode /tmp/mineiro.tar.xz.b64 > /tmp/mineiro.tar.xz
          mkdir -p /tmp/mineiro-release
          tar -xJf /tmp/mineiro.tar.xz -C /tmp/mineiro-release

      - name: Replace release branch tree
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/mineiro-release/. .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "release: Mineiro Username Extractor v1.2.0"
          git push origin HEAD:release/mineiro-v1.2.0

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Product validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache npm downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node22-npm-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-node22-npm-

      - name: Install dependencies
        run: npm install --prefer-offline --no-audit --no-fund

      - name: Validate product brand
        run: npm run brand:validate

      - name: Validate i18n catalogs
        run: npm run i18n:validate

      - name: Validate Registry
        run: npm run registry:validate

      - name: Type check
        run: npm run lint

      - name: Synthetic detector demo
        run: npm run demo

      - name: Intelligence smoke test
        run: npm run intelligence:test

      - name: Graph hunting smoke test
        run: npm run graph:test

      - name: Validate official Colab
        run: npm run colab:validate

      - name: Validate documentation surface
        run: npm run docs:validate

      - name: Validate offline manual
        run: npm run manual:validate

      - name: Validate launchers
        run: |
          bash -n iniciar-mineiro.sh
          bash -n Iniciar-Mineiro.command

      - name: Build production bundle
        run: npm run build

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Validate Registry
        run: npm run registry:validate

      - name: Registry stats
        run: npm run registry:stats

      - name: Type check
        run: npm run lint

      - name: Run synthetic demo
        run: npm run demo

      - name: Validate offline manual
        run: npm run manual:validate

      - name: Validate Linux launcher syntax
        run: bash -n iniciar-mineiro.sh

      - name: Validate macOS launcher syntax
        run: bash -n Iniciar-Mineiro.command

      - name: Build
        run: npm run build
